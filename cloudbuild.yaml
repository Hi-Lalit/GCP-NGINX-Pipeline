options:
  logging: CLOUD_LOGGING_ONLY

steps:
# Build Docker Image
- name: 'gcr.io/cloud-builders/docker'
  args:
    [
      'build',
      '-t',
      'us-east1-docker.pkg.dev/$PROJECT_ID/nginx-registry/nginx-app',
      '-f',
      'webapp-nginx/Dockerfile',
      'webapp-nginx'
    ]

# Push Image
- name: 'gcr.io/cloud-builders/docker'
  args:
    [
      'push',
      'us-east1-docker.pkg.dev/$PROJECT_ID/nginx-registry/nginx-app'
    ]

# Deploy to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    [
      'run',
      'deploy',
      'nginx-service',
      '--image=us-east1-docker.pkg.dev/$PROJECT_ID/nginx-registry/nginx-app',
      '--region=us-east1',
      '--platform=managed',
      '--allow-unauthenticated',
      '--port=8080'
    ]
